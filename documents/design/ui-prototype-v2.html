<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Member Rewards Console — Prototype</title>
<link rel="icon" type="image/png" href="../../assets/logo-icon.png">
<style>
/* ============================================================
   TOKENS — verbatim from documents/design/ui-theme.md
   ============================================================ */
:root {
  --accent: #4f46e5;
  --accent-weak: #eef2ff;
  --bg: #f8fafc;
  --surface: #ffffff;
  --border: #e2e8f0;
  --text: #0f172a;
  --text-muted: #64748b;
  --success: #059669;
  --success-weak: #ecfdf5;
  --warning: #d97706;
  --warning-weak: #fffbeb;
  --warning-text: #92400e;
  --danger: #dc2626;
  --danger-weak: #fef2f2;
  --radius-sm: 6px;
  --radius-lg: 8px;
  --shadow-modal: 0 20px 48px -12px rgb(15 23 42 / 0.28), 0 4px 12px -4px rgb(15 23 42 / 0.12);
  --sidebar-w: 236px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --accent: #6366f1;
    --accent-weak: #1e1b4b;
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --success: #10b981;
    --success-weak: #052e21;
    --warning: #f59e0b;
    --warning-weak: #3a2a06;
    --warning-text: #f59e0b;
    --danger: #ef4444;
    --danger-weak: #3d1414;
    --shadow-modal: 0 20px 48px -12px rgb(0 0 0 / 0.55), 0 4px 12px -4px rgb(0 0 0 / 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --accent: #6366f1; --accent-weak: #1e1b4b; --bg: #0f172a; --surface: #1e293b; --border: #334155;
  --text: #f1f5f9; --text-muted: #94a3b8; --success: #10b981; --success-weak: #052e21;
  --warning: #f59e0b; --warning-weak: #3a2a06; --warning-text: #f59e0b; --danger: #ef4444; --danger-weak: #3d1414;
  --shadow-modal: 0 20px 48px -12px rgb(0 0 0 / 0.55), 0 4px 12px -4px rgb(0 0 0 / 0.35);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --accent: #4f46e5; --accent-weak: #eef2ff; --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0;
  --text: #0f172a; --text-muted: #64748b; --success: #059669; --success-weak: #ecfdf5;
  --warning: #d97706; --warning-weak: #fffbeb; --warning-text: #92400e; --danger: #dc2626; --danger-weak: #fef2f2;
  --shadow-modal: 0 20px 48px -12px rgb(15 23 42 / 0.28), 0 4px 12px -4px rgb(15 23 42 / 0.12);
  color-scheme: light;
}

/* ============================================================
   RESET + BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1, h2, h3, h4, p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
::selection { background: var(--accent); color: #fff; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
#app { min-height: 100vh; }
.app-shell { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }

.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  padding: 16px 12px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 18px; }
.brand-mark {
  width: 26px; height: 26px; border-radius: var(--radius-sm); flex-shrink: 0;
  object-fit: cover;
}
.brand-name { font-weight: 600; font-size: 13.5px; letter-spacing: -0.01em; }
.brand-sub { font-size: 11px; color: var(--text-muted); }

.sidebar-nav { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.nav-section-label {
  font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-muted); padding: 14px 10px 5px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--radius-sm);
  color: var(--text); font-size: 13.5px; cursor: pointer; border: none; background: none; width: 100%; text-align: left;
}
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.75; }
.nav-item:hover { background: var(--bg); text-decoration: none; }
.nav-item.active { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
.nav-item.active svg { opacity: 1; }

.sidebar-footer { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 8px; display: flex; flex-direction: column; gap: 2px; }
.sidebar-footer .nav-item { font-size: 12.5px; color: var(--text-muted); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: 20px 32px 0;
}
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-bottom: 16px; }
.page-title { font-size: 20px; font-weight: 650; letter-spacing: -0.015em; }
.page-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; }
.page-actions { display: flex; gap: 8px; flex-shrink: 0; }

.content { padding: 0 32px 40px; flex: 1; }
.content.narrow { max-width: 620px; }
.entry-wrap { max-width: 640px; margin: 0 auto; }
.entry-amount-input { font-size: 28px; font-weight: 650; height: 58px; letter-spacing: -0.01em; }

.breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-muted); margin-bottom: 10px; flex-wrap: wrap; }
.breadcrumb a { display: inline-flex; align-items: center; gap: 4px; }
.breadcrumb svg { width: 13px; height: 13px; flex-shrink: 0; }
.breadcrumb a { color: var(--text-muted); }
.breadcrumb a:hover { color: var(--accent); }
.breadcrumb .sep { opacity: 0.5; }
.breadcrumb .current { color: var(--text); font-weight: 600; }

/* ============================================================
   BANNER (outstanding month — never dismissible)
   ============================================================ */
.banner-slot { min-height: 0; }
.banner {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  background: var(--warning-weak); border: 1px solid color-mix(in srgb, var(--warning) 35%, var(--border));
  border-radius: var(--radius-lg); padding: 11px 16px; margin-bottom: 18px;
}
.banner-text { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text); }
.banner-icon { width: 17px; height: 17px; color: var(--warning); flex-shrink: 0; }
.banner strong { font-weight: 650; }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 13px; border-radius: var(--radius-sm); border: 1px solid transparent;
  font-size: 13px; font-weight: 550; cursor: pointer; white-space: nowrap; transition: background 0.1s, border-color 0.1s, opacity 0.1s;
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn-secondary { background: var(--surface); border-color: var(--border); color: var(--text); }
.btn-secondary:hover:not(:disabled) { background: var(--bg); }
.btn-ghost { background: none; color: var(--text-muted); }
.btn-ghost:hover:not(:disabled) { background: var(--bg); color: var(--text); }
.btn-danger { background: var(--surface); border-color: var(--border); color: var(--danger); }
.btn-danger:hover:not(:disabled) { background: var(--danger-weak); border-color: var(--danger); }
.btn-sm { height: 27px; padding: 0 9px; font-size: 12.5px; }
.btn-block { width: 100%; }
.btn-commit { height: 36px; padding: 0 18px; font-weight: 700; }
.btn svg { width: 14px; height: 14px; }

/* ============================================================
   CARDS / STATS
   ============================================================ */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; }
.card-title { font-size: 13px; font-weight: 650; margin-bottom: 2px; }
.card-sub { font-size: 12px; color: var(--text-muted); }
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; }

.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.stat-row.n3 { grid-template-columns: repeat(3, 1fr); }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
.stat-label { font-size: 11.5px; color: var(--text-muted); font-weight: 550; text-transform: uppercase; letter-spacing: 0.04em; }
.stat-value { font-size: 22px; font-weight: 650; margin-top: 4px; letter-spacing: -0.01em; }
.stat-foot { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }

.two-col { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; align-items: start; }

/* ============================================================
   FORMS
   ============================================================ */
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.field label, .field .field-label { font-size: 12.5px; font-weight: 600; color: var(--text); }
.field .hint { font-size: 11.5px; color: var(--text-muted); }
.field .hint.warn { color: var(--warning-text); }
.field .err { font-size: 11.5px; color: var(--danger); }
input[type="text"], input[type="tel"], input[type="email"], input[type="number"], input[type="password"], input[type="date"], select, textarea {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 0 11px; height: 34px; width: 100%; color: var(--text);
}
textarea { padding: 9px 11px; height: auto; min-height: 60px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
input.invalid, select.invalid { border-color: var(--danger); }
input:disabled, select:disabled { background: var(--bg); color: var(--text-muted); cursor: not-allowed; }
.checkbox-row { display: flex; align-items: flex-start; gap: 9px; font-size: 12.5px; }
.checkbox-row input[type="checkbox"] { width: 16px; height: 16px; margin-top: 1px; accent-color: var(--accent); flex-shrink: 0; }
.pw-field-wrap { position: relative; }
.pw-field-wrap input { padding-right: 38px; letter-spacing: 0.06em; }
.pw-toggle { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border: none; background: none; color: var(--text-muted); cursor: pointer; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; }
.pw-toggle:hover { background: var(--bg); color: var(--text); }
.pw-toggle svg { width: 15px; height: 15px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.form-grid .span2 { grid-column: 1 / -1; }

.segmented { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 2px; background: var(--bg); }
.segmented button { border: none; background: none; padding: 6px 13px; font-size: 12.5px; font-weight: 550; border-radius: 5px; cursor: pointer; color: var(--text-muted); }
.segmented button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / 0.06); }

/* ============================================================
   TABLES
   ============================================================ */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  text-align: left; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.045em;
  color: var(--text-muted); padding: 9px 14px; border-bottom: 1px solid var(--border); white-space: nowrap;
}
thead th.num, td.num { text-align: right; }
tbody td { padding: 0 14px; height: 40px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--bg); }
td.cell-primary { font-weight: 550; }
.table-foot-row td { font-weight: 650; background: var(--bg); }

/* ============================================================
   PILLS
   ============================================================ */
.pill { display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 9px; border-radius: 999px; font-size: 11px; font-weight: 650; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; }
.pill-active { background: var(--success-weak); color: var(--success); }
.pill-active::before { background: var(--success); }
.pill-inactive { background: var(--danger-weak); color: var(--danger); }
.pill-inactive::before { background: var(--danger); }
.pill-slab { background: var(--accent-weak); color: var(--accent); }
.pill-slab::before { display: none; }
.pill-locked { background: var(--warning-weak); color: var(--warning); }
.pill-locked::before { background: var(--warning); }
.pill-neutral { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }
.pill-neutral::before { display: none; }

/* ============================================================
   MODAL / TOAST — real components; native dialogs are unreliable in-sandbox
   ============================================================ */
.modal-backdrop {
  position: fixed; inset: 0; background: rgb(15 23 42 / 0.5); backdrop-filter: blur(1px);
  display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px;
  animation: fade-in 0.12s ease;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-modal);
  width: 100%; max-width: 480px; max-height: 88vh; display: flex; flex-direction: column;
  animation: modal-in 0.14s cubic-bezier(.2,.7,.3,1);
}
.modal.wide { max-width: 640px; }
@keyframes modal-in { from { opacity: 0; transform: translateY(6px) scale(0.98); } to { opacity: 1; transform: none; } }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-header h2 { font-size: 15px; font-weight: 650; }
.modal-close { background: none; border: none; color: var(--text-muted); cursor: pointer; width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.modal-close:hover { background: var(--bg); color: var(--text); }
.modal-body { padding: 18px 20px; overflow-y: auto; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }
.modal-warn { background: var(--warning-weak); border: 1px solid color-mix(in srgb, var(--warning) 35%, var(--border)); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12.5px; margin-bottom: 14px; }
.modal-danger-note { background: var(--danger-weak); border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--border)); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12.5px; margin-bottom: 14px; }
.modal-warn-row { display: flex; gap: 9px; align-items: flex-start; }
.modal-warn-row svg { width: 15px; height: 15px; color: var(--warning); flex-shrink: 0; margin-top: 1px; }
.modal-warn-text { color: var(--warning-text); }
.modal-warn-text b { font-weight: 650; }

/* Settings pre-save impact summary */
.impact { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 14px; }
.impact-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 9px 12px; font-size: 12.5px; }
.impact-row + .impact-row { border-top: 1px solid var(--border); }
.impact-label { color: var(--text-muted); }
.impact-val { font-weight: 650; font-variant-numeric: tabular-nums; }
.impact-val .was { color: var(--text-muted); font-weight: 400; }
.impact-val .arrow { color: var(--text-muted); font-weight: 400; padding: 0 3px; }
.impact-heading { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.045em; color: var(--text-muted); margin-bottom: 8px; }
.impact-tbl { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.impact-tbl td { height: 34px; }
.impact-more { font-size: 12px; color: var(--text-muted); padding: 8px 12px; background: var(--bg); border-top: 1px solid var(--border); }
.slab-move { display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
.slab-move .to { font-weight: 650; }
.slab-move .sep { color: var(--text-muted); }

#toast-root { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toast {
  background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 12.5px;
  box-shadow: var(--shadow-modal); display: flex; align-items: center; gap: 8px; max-width: 340px;
  animation: toast-in 0.16s ease;
}
@keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.toast svg { width: 15px; height: 15px; flex-shrink: 0; }
.toast.success { background: var(--success); color: #fff; }
.toast.danger { background: var(--danger); color: #fff; }

/* ============================================================
   AUTH SCREENS (first-run / login / lock / recovery)
   ============================================================ */
.auth-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.auth-card { width: 100%; max-width: 380px; }
.auth-brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 28px; }
.auth-brand .brand-mark { width: 40px; height: 40px; border-radius: 11px; }
.auth-hero-mark { display: block; width: 72px; height: 72px; border-radius: 16px; margin: 0 auto; object-fit: cover; }
.auth-title { font-size: 18px; font-weight: 650; text-align: center; letter-spacing: -0.01em; }
.auth-sub { font-size: 12.5px; color: var(--text-muted); text-align: center; margin-top: 5px; }
.auth-body { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; margin-top: 20px; }
.auth-foot { text-align: center; margin-top: 16px; font-size: 12.5px; }

.pin-dots { display: flex; justify-content: center; gap: 12px; margin-bottom: 22px; }
.pin-dot { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--border); transition: background .1s, border-color .1s; }
.pin-dot.filled { background: var(--accent); border-color: var(--accent); }
.pin-dot.err { border-color: var(--danger); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad button {
  height: 52px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg);
  font-size: 18px; font-weight: 550; cursor: pointer; color: var(--text);
}
.keypad button:hover { background: var(--accent-weak); border-color: var(--accent); }
.keypad button:active { transform: scale(0.96); }
.keypad button.empty { visibility: hidden; }

.restore-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.restore-opt { display: flex; gap: 10px; align-items: flex-start; width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; cursor: pointer; background: var(--surface); text-align: left; }
.restore-opt:hover { background: var(--bg); }
.restore-opt.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); background: var(--surface); }
.restore-radio { width: 15px; height: 15px; border-radius: 999px; border: 1px solid var(--border); flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; }
.restore-opt.sel .restore-radio { border-color: var(--accent); }
.restore-opt.sel .restore-radio::after { content: ""; width: 7px; height: 7px; border-radius: 999px; background: var(--accent); }
.restore-main { display: block; font-size: 13px; font-weight: 600; }
.restore-sub { display: block; font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

.lockout-box { text-align: center; padding: 10px 0 4px; }
.lockout-count { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 10px 0; color: var(--danger); }

/* ============================================================
   SEARCH
   ============================================================ */
.search-box { position: relative; }
.search-input-wrap { position: relative; }
.search-input-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text-muted); }
.search-input-wrap input { padding-left: 32px; }
.search-results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-modal); max-height: 300px; overflow-y: auto; z-index: 20;
}
.search-result-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; border-bottom: 1px solid var(--border); }
.search-result-row:last-child { border-bottom: none; }
.search-result-row:hover { background: var(--bg); }
.search-result-name { font-weight: 550; font-size: 13px; }
.search-result-meta { font-size: 11.5px; color: var(--text-muted); }
.search-empty { padding: 16px 12px; text-align: center; color: var(--text-muted); font-size: 12.5px; }

/* ============================================================
   AVATAR / EMPTY STATES
   ============================================================ */
.avatar {
  width: 40px; height: 40px; border-radius: 10px; background: var(--accent-weak); color: var(--accent);
  display: flex; align-items: center; justify-content: center; font-weight: 650; font-size: 14px; flex-shrink: 0;
}
.avatar.sm { width: 30px; height: 30px; border-radius: 8px; font-size: 12px; }

.empty-state { text-align: center; padding: 44px 20px; color: var(--text-muted); }
.empty-state svg { width: 32px; height: 32px; margin-bottom: 10px; opacity: 0.5; }
.empty-state-title { font-size: 13.5px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
.empty-state-sub { font-size: 12.5px; }

   BAR CHART (single accent, label-encoded — no rainbow)
   ============================================================ */
.bar-list { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: 46px 1fr 34px; align-items: center; gap: 10px; }
.bar-row-label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
.bar-track { height: 9px; background: var(--bg); border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; width: 100%; background: var(--accent); border-radius: 5px; transform-origin: left; transition: transform 0.3s ease; }
.bar-row-count { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-muted); }
.bar-top-badge { font-size: 10px; font-weight: 700; letter-spacing: .03em; color: var(--accent); margin-left: 6px; }
.bar-list-lg { display: grid; grid-template-columns: minmax(60px, auto) 1fr 90px; align-items: center; gap: 14px; }
.bar-row-lg { display: contents; }
.bar-row-label-lg { font-size: 13.5px; font-weight: 650; color: var(--text); white-space: nowrap; }
.bar-track-lg { height: 16px; border-radius: 8px; }
.bar-track-lg .bar-fill { border-radius: 8px; }
.bar-row-count-lg { font-size: 13.5px; font-weight: 650; color: var(--text); }

/* ============================================================
   STRUCTURE TREE
   ============================================================ */
.tree-toolbar { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
.tree-toolbar .search-box { flex: 1; max-width: 380px; }
.tree-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow-x: auto; overflow-y: hidden; }

   row that overflows its own container would push its first cards out of scrolling reach */
.tree-canvas { position: relative; width: max-content; min-width: 100%; padding: 32px 20px 36px; min-height: 320px; transform-origin: 0 0; }
.tree-connectors { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.tree-connectors line { stroke: var(--border); stroke-width: 1.5; }
.tree-root-row { display: flex; justify-content: center; margin-bottom: 6px; }
.tree-children-row { display: flex; justify-content: center; gap: 18px; flex-wrap: nowrap; padding-top: 36px; }
.tree-zoom { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 2px; background: var(--bg); }
.tree-zoom button { border: none; background: none; height: 26px; min-width: 28px; padding: 0 8px; border-radius: 5px; cursor: pointer; color: var(--text-muted); font: inherit; font-size: 12.5px; font-weight: 550; }
.tree-zoom button:hover:not(:disabled) { background: var(--surface); color: var(--text); }
.tree-zoom button:disabled { opacity: 0.4; cursor: not-allowed; }
.tree-zoom .tree-zoom-level { min-width: 46px; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text-muted); }
.tree-node {
  width: 172px; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-lg);
  padding: 12px 13px; cursor: pointer; transition: border-color .1s, transform .1s;
}
.tree-node:hover { border-color: var(--accent); transform: translateY(-1px); }
.tree-node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tree-node.root-node { border-color: var(--accent); background: var(--accent-weak); width: 190px; }
.tree-node.open-node { border-color: var(--accent); }
.tree-node.leaf-node { cursor: default; }
.tree-node.leaf-node:hover { border-color: var(--border); transform: none; }
.tree-node-name { font-size: 13px; font-weight: 650; margin-bottom: 2px; }
.tree-node-id { font-size: 11px; color: var(--text-muted); }
.tree-node-bv { display: flex; justify-content: space-between; align-items: baseline; margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--border); }
.tree-node-bv-label { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
.tree-node-bv-val { font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tree-node-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.tree-node-legs { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 650; color: var(--accent); }
.tree-node.leaf-node .tree-node-legs { color: var(--text-muted); font-weight: 400; }
.tree-node-legs svg { width: 11px; height: 11px; transition: transform .12s; }
.tree-node.open-node .tree-node-legs svg { transform: rotate(90deg); }

   on its own and make a narrow chart scroll sideways for no reason — cap it instead */
.tree-canvas .tree-advisory, .tree-canvas .empty-state { max-width: 460px; margin-left: auto; margin-right: auto; }

   WIZARD (monthly close)
   ============================================================ */
.wizard-shell { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 24px; }
.wizard-card { width: 100%; max-width: 560px; }
.wizard-steps { display: flex; gap: 6px; margin-bottom: 26px; }
.wizard-steps .seg { flex: 1; height: 4px; border-radius: 3px; background: var(--border); }
.wizard-steps .seg.done, .wizard-steps .seg.active { background: var(--accent); }
.wizard-icon-wrap { width: 52px; height: 52px; border-radius: 14px; background: var(--accent-weak); color: var(--accent); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
.wizard-icon-wrap svg { width: 24px; height: 24px; }
.wizard-icon-wrap.success { background: var(--success-weak); color: var(--success); }
.wizard-icon-wrap.danger { background: var(--danger-weak); color: var(--danger); }

.wizard-sub { font-size: 13px; color: var(--text-muted); text-align: center; margin-top: 6px; max-width: 420px; margin-inline: auto; }
.wizard-body { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px; margin-top: 22px; }
.wizard-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: center; }
.spinner { width: 16px; height: 16px; border: 2px solid var(--accent-weak); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.checklist-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.checklist-row:last-child { border-bottom: none; }
.checklist-icon { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.checklist-icon.pending { border: 1.5px solid var(--border); }
.checklist-icon.done { background: var(--success); color: #fff; }

.flex { display: flex; }

.muted { color: var(--text-muted); }

/* ============================================================
   CALCULATION ENGINE — pure functions, one implementation, reused everywhere
   ============================================================ */
let SETTINGS = {
  slabTable: [
    { threshold: 0, pct: 0 }, { threshold: 100, pct: 2 }, { threshold: 400, pct: 4 },
    { threshold: 1200, pct: 6 }, { threshold: 3000, pct: 8 }, { threshold: 5000, pct: 10 },
    { threshold: 7000, pct: 12 }, { threshold: 10000, pct: 14 },
  ],
  royaltyMinChildren: 3,
  royaltyRatePct: 1,
  structureDepthGuidance: 4,
  widthL2: 9, widthL3: 6, widthL4: 3,
  yearlyCycleStart: '01-01', yearlyCycleEnd: '12-31',
  lowContributionThreshold: 100,
  defaultExportColumns: ['name', 'id', 'phone', 'bv'],
  sessionTimeoutMinutes: 15,
};

function sortedSlabTable() { return SETTINGS.slabTable.slice().sort(function (a, b) { return a.threshold - b.threshold; }); }
function topSlabPct() { const t = sortedSlabTable(); return t[t.length - 1].pct; }
function slabFor(tbv) {
  const t = sortedSlabTable();
  let cur = t[0].pct;
  for (let i = 0; i < t.length; i++) { if (tbv >= t[i].threshold) cur = t[i].pct; else break; }
  return cur;
}

// bvMap: Map(memberId -> own BV for the period being calculated)
function rollupTBV(bvMap) {
  const tbv = new Map();
  function walk(id) {
    if (tbv.has(id)) return tbv.get(id);
    const own = bvMap.get(id) || 0;
    let sum = own;
    directChildren(id).forEach(function (c) { sum += walk(c.id); });
    tbv.set(id, Math.round(sum * 100) / 100);
    return tbv.get(id);
  }
  MEMBERS.forEach(function (m) { walk(m.id); });
  return tbv;
}

function computeRewards(bvMap, tbvMap) {
  const rewards = new Map(); // id -> { differential, royalty, ownReward, total, breakdown: [{childId, childSlab, diffPct, tbv, amount}], qualifying, royaltyChildren }
  const top = topSlabPct();
  MEMBERS.forEach(function (m) {
    const ownSlab = slabFor(tbvMap.get(m.id) || 0);
    const kids = directChildren(m.id);
    let differential = 0;
    const breakdown = kids.map(function (c) {
      const cTbv = tbvMap.get(c.id) || 0;
      const cSlab = slabFor(cTbv);
      const diffPct = Math.max(0, ownSlab - cSlab);
      const amount = Math.round(diffPct / 100 * cTbv * 100) / 100;
      differential += amount;
      return { childId: c.id, childSlab: cSlab, diffPct: diffPct, tbv: cTbv, amount: amount };
    });
    const qualifyingKids = kids.filter(function (c) { return slabFor(tbvMap.get(c.id) || 0) === top; });
    let royalty = 0;
    const royaltyOn = qualifyingKids.length >= SETTINGS.royaltyMinChildren;
    if (royaltyOn) {
      qualifyingKids.forEach(function (c) { royalty += Math.round(SETTINGS.royaltyRatePct / 100 * (tbvMap.get(c.id) || 0) * 100) / 100; });
    }
    differential = Math.round(differential * 100) / 100;
    royalty = Math.round(royalty * 100) / 100;
    // Rule-46 (CR-4, 8 Aug 2026): own Business Volume also earns, at the member's own slab.
    const ownReward = Math.round(ownSlab / 100 * (bvMap.get(m.id) || 0) * 100) / 100;
    rewards.set(m.id, {
      ownSlab: ownSlab, differential: differential, royalty: royalty, ownReward: ownReward,
      total: Math.round((differential + royalty + ownReward) * 100) / 100,
      breakdown: breakdown, qualifyingCount: qualifyingKids.length, childCount: kids.length, royaltyOn: royaltyOn,
    });
  });
  return rewards;
}

/* Dry run for the settings warning (RQ-18/V7.6): what would the open month look like
   under different slab/royalty settings? Total Business Volume cannot move — rollupTBV
   reads only the business-volume map and the hierarchy — so the live TBV is reused and
   only computeRewards is re-run. slabFor/topSlabPct/computeRewards read SETTINGS
   directly, so the candidate values are swapped in and restored in a finally block:
   a throw must never leave the live settings holding uncommitted values. */
function previewRecalcImpact(nextPartial) {
  const beforeRewards = liveRewards();
  let beforeTotal = 0, beforeRoyaltyCount = 0;
  const beforeSlab = new Map();
  MEMBERS.forEach(function (m) {
    const r = beforeRewards.get(m.id);
    beforeTotal += r.total;
    beforeSlab.set(m.id, r.ownSlab);
    if (r.royalty > 0) beforeRoyaltyCount++;
  });

  const saved = { slabTable: SETTINGS.slabTable, royaltyMinChildren: SETTINGS.royaltyMinChildren, royaltyRatePct: SETTINGS.royaltyRatePct };
  let after;
  try {
    if (nextPartial.slabTable) SETTINGS.slabTable = nextPartial.slabTable;
    if (nextPartial.royaltyMinChildren != null) SETTINGS.royaltyMinChildren = nextPartial.royaltyMinChildren;
    if (nextPartial.royaltyRatePct != null) SETTINGS.royaltyRatePct = nextPartial.royaltyRatePct;
    after = computeRewards(liveBV(), liveTBV());
  } finally {
    SETTINGS.slabTable = saved.slabTable;
    SETTINGS.royaltyMinChildren = saved.royaltyMinChildren;
    SETTINGS.royaltyRatePct = saved.royaltyRatePct;
  }

  let afterTotal = 0, afterRoyaltyCount = 0;
  const slabMoves = [], royaltyMoves = [];
  MEMBERS.forEach(function (m) {
    const a = after.get(m.id);
    afterTotal += a.total;
    if (a.royalty > 0) afterRoyaltyCount++;
    const fromSlab = beforeSlab.get(m.id);
    if (fromSlab !== a.ownSlab) slabMoves.push({ id: m.id, name: m.name, from: fromSlab, to: a.ownSlab });
    const wasEarning = beforeRewards.get(m.id).royalty > 0;
    if (wasEarning !== (a.royalty > 0)) royaltyMoves.push({ id: m.id, name: m.name, starts: a.royalty > 0 });
  });
  slabMoves.sort(function (x, y) { return Math.abs(y.to - y.from) - Math.abs(x.to - x.from) || x.name.localeCompare(y.name); });
  royaltyMoves.sort(function (x, y) { return (x.starts === y.starts) ? x.name.localeCompare(y.name) : (x.starts ? -1 : 1); });

  return {
    beforeTotal: Math.round(beforeTotal * 100) / 100,
    afterTotal: Math.round(afterTotal * 100) / 100,
    beforeRoyaltyCount: beforeRoyaltyCount,
    afterRoyaltyCount: afterRoyaltyCount,
    slabMoves: slabMoves,
    royaltyMoves: royaltyMoves,
  };
}

const CRC_TABLE = (function () {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function strToBytes(str) { return new TextEncoder().encode(str); }
function crc32(str) {
  let bytes = typeof str === 'string' ? strToBytes(str) : str;
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

   XLSX WRITER — minimal, real, uncompressed-ZIP OOXML (no deps)
   ============================================================ */
function u16(n) { return [n & 0xFF, (n >>> 8) & 0xFF]; }
function u32(n) { return [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF]; }
function dosDateTime() { return { time: u16(0), date: u16(0x0021) }; } // fixed date, cosmetic only

function buildZip(files) {
  // files: [{name, content(string)}]  -- all STORED (uncompressed) for zero-dependency simplicity
  const localParts = []; const centralParts = []; let offset = 0;
  files.forEach(function (f) {
    const nameBytes = strToBytes(f.name);
    const dataBytes = strToBytes(f.content);
    const crc = crc32(dataBytes);
    const dt = dosDateTime();
    const local = [].concat(
      u32(0x04034b50), u16(20), u16(0), u16(0), dt.time, dt.date,
      u32(crc), u32(dataBytes.length), u32(dataBytes.length),
      u16(nameBytes.length), u16(0)
    );
    const localHeader = new Uint8Array(local.length + nameBytes.length);
    localHeader.set(local, 0); localHeader.set(nameBytes, local.length);
    localParts.push(localHeader, dataBytes);

    const central = [].concat(
      u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), dt.time, dt.date,
      u32(crc), u32(dataBytes.length), u32(dataBytes.length),
      u16(nameBytes.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset)
    );
    const centralHeader = new Uint8Array(central.length + nameBytes.length);
    centralHeader.set(central, 0); centralHeader.set(nameBytes, central.length);
    centralParts.push(centralHeader);

    offset += localHeader.length + dataBytes.length;
  });
  const centralStart = offset;
  let centralSize = 0; centralParts.forEach(function (p) { centralSize += p.length; });
  const eocd = new Uint8Array([].concat(
    u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
    u32(centralSize), u32(centralStart), u16(0)
  ));
  return new Blob([].concat(localParts, centralParts, [eocd]), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

  rowsXml += '<row r="' + r + '">' + headerRow.map(function (h, i) { return cellXml(i, r, h); }).join('') + '</row>';
  rows.forEach(function (row) {
    r++;

  });
  const sheetXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>' + rowsXml + '</sheetData></worksheet>';
  const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
    '</Types>';
  const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    '</Relationships>';
  const workbook = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
    '<sheets><sheet name="' + xmlEscape(sheetName) + '" sheetId="1" r:id="rId1"/></sheets></workbook>';
  const workbookRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
    '</Relationships>';
  return buildZip([
    { name: '[Content_Types].xml', content: contentTypes },
    { name: '_rels/.rels', content: rootRels },
    { name: 'xl/workbook.xml', content: workbook },
    { name: 'xl/_rels/workbook.xml.rels', content: workbookRels },
    { name: 'xl/worksheets/sheet1.xml', content: sheetXml },
  ]);
}
function downloadXlsx(filename, sheetName, headerRow, rows) {
  const blob = buildXlsx(sheetName, headerRow, rows);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a);

}

}
function connectorLinesForParent(parentId, wrapRect, zoom) {
  const rootEl = document.getElementById('tree-node-' + parentId);
  const kids = directChildren(parentId);
  if (!rootEl || !kids.length) return '';
  // every measurement here is post-transform screen pixels; the svg sits inside the scaled canvas,
  // so coordinates are divided by the zoom on the way out and the few fixed offsets are scaled into it
  const z = zoom || 1;
  const rootRect = rootEl.getBoundingClientRect();
  const rootX = rootRect.left + rootRect.width / 2 - wrapRect.left;
  const rootBottomY = rootRect.bottom - wrapRect.top;

  const rows = [];
  kids.map(function (k) { return document.getElementById('tree-node-' + k.id); }).filter(Boolean).forEach(function (el) {
    const r = el.getBoundingClientRect();
    const top = Math.round(r.top);
    let row = rows.find(function (rw) { return Math.abs(rw.top - top) < 4; });
    if (!row) { row = { top: top, xs: [] }; rows.push(row); }
    row.xs.push(r.left + r.width / 2 - wrapRect.left);
  });
  rows.sort(function (a, b) { return a.top - b.top; });
  rows.forEach(function (row) {
    row.topY = row.top - wrapRect.top;
    row.trunkY = row.topY - 14 * z;
    row.minX = Math.min.apply(null, row.xs);
    row.maxX = Math.max.apply(null, row.xs);
    row.centerX = (row.minX + row.maxX) / 2;
  });

  const line = function (x1, y1, x2, y2) { return '<line x1="' + (x1 / z) + '" y1="' + (y1 / z) + '" x2="' + (x2 / z) + '" y2="' + (y2 / z) + '"></line>'; };
  const CHANNEL_X = 10 * z;
  let lines = '';
  rows.forEach(function (row, i) {
    let barMin = row.minX, barMax = row.maxX;
    if (i === 0) {
      lines += line(rootX, rootBottomY, rootX, row.trunkY);
      // the parent card is one of a centred row of siblings, so it can sit outside the span of its
      // own legs — widen the trunk until it reaches the parent's stem
      barMin = Math.min(barMin, rootX); barMax = Math.max(barMax, rootX);
    } else {
      const prev = rows[i - 1];
      lines += line(prev.centerX, prev.trunkY, CHANNEL_X, prev.trunkY);
      lines += line(CHANNEL_X, prev.trunkY, CHANNEL_X, row.trunkY);
      lines += line(CHANNEL_X, row.trunkY, row.centerX, row.trunkY);
    }
    if (barMax > barMin) lines += line(barMin, row.trunkY, barMax, row.trunkY);
    row.xs.forEach(function (x) { lines += line(x, row.trunkY, x, row.topY); });
  });
  return lines;
}
function drawTreeConnectors() {
  const svg = document.getElementById('tree-connectors');
  // measure against the canvas, not the scroller — both rects move together when the chart is scrolled
  const canvas = document.getElementById('tree-canvas');
  const currentId = APP.params && APP.params.id ? APP.params.id : ROOT_ID;
  if (!svg || !canvas || !document.getElementById('tree-node-' + currentId)) return;
  const canvasRect = canvas.getBoundingClientRect();

}

function restorePoints() {

   VIEW — Home / Search
   ============================================================ */
// Rule-44 — one match function for every search box in the console. Name substring, member-number digits,
// or phone digits with a four-digit floor so a short query can't sweep in half the network. Both sides are
// reduced to digits before the phone compare, so formatting the admin typed is irrelevant; the stored value
// is never rewritten.
const PHONE_MIN_DIGITS = 4;
function digitsOf(s) { return String(s == null ? '' : s).replace(/\D/g, ''); }
// A number is the same number however it was written down: drop an international prefix or a trunk zero so
// "+91 98765 43210", "098765 43210" and "9876543210" all reduce to the same key. Both the stored value and
// the query go through this; the stored value itself is never rewritten.
function phoneKey(s) {
  const d = digitsOf(s);
  return d.length > 10 ? d.slice(-10) : d.replace(/^0+/, '');
}
function memberMatches(m, q, qDigits, qPhone) {
  if (m.name.toLowerCase().indexOf(q) !== -1) return true;
  if (qDigits && String(m.id).indexOf(qDigits) !== -1) return true;
  return qPhone.length >= PHONE_MIN_DIGITS && phoneKey(m.phone).indexOf(qPhone) !== -1;
}
function searchMembers(q, opts) {
  q = (q || '').trim().toLowerCase();
  if (!q) return null;
  const qDigits = digitsOf(q);
  const qPhone = phoneKey(q);
  const activeOnly = opts && opts.activeOnly;
  return MEMBERS.filter(function (m) {
    return (!activeOnly || m.active) && memberMatches(m, q, qDigits, qPhone);
  }).slice(0, (opts && opts.limit) || 25);
}
function homeResultsHtml(q) {
  const results = searchMembers(q);
  if (!results) {
    return '<div class="empty-state">' + ICON.search.replace('<svg ', '<svg style="width:28px;height:28px;margin-bottom:10px;opacity:.5" ') + '<div class="empty-state-title">Search for a member to see their details</div><div class="empty-state-sub">Type a name, 6-digit member number or phone number above — nothing is shown until you search.</div></div>';
  }
  const rows = results.map(function (m) {
    return '<tr class="clickable" onclick="P.nav(\'member\',{id:' + m.id + '})"><td class="cell-primary">' + esc(m.name) + '</td><td class="mono">' + m.id + '</td><td class="mono">' + esc(m.phone) + '</td><td class="num">' + fmtInt(liveTBV().get(m.id) || 0) + '</td><td>' + pillSlab(liveRewards().get(m.id).ownSlab) + '</td><td>' + pillActive(m.active) + '</td></tr>';
  }).join('');
  return '<div class="card-head"><div><div class="card-title">' + results.length + ' result' + (results.length === 1 ? '' : 's') + '</div>' +
    '<div class="card-sub">Matching "' + esc(q) + '"</div></div></div>' +
    (results.length === 0
      ? '<div class="empty-state">' + ICON.inbox.replace('<svg ', '<svg style="width:32px;height:32px;margin-bottom:10px;opacity:.5" ') + '<div class="empty-state-title">No members match "' + esc(q) + '"</div><div class="empty-state-sub">Try a different name, member number or phone.</div></div>'
      : '<div class="table-wrap"><table><thead><tr><th>Name</th><th>Member #</th><th>Phone</th><th class="num">Total Business Volume</th><th>Slab</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table></div>');
}

  const buckets = sortedSlabTable().map(function (row) { return { pct: row.pct, count: MEMBERS.filter(function (m) { return liveRewards().get(m.id).ownSlab === row.pct; }).length }; });

    '<div id="home-results" class="mt-3">' + homeResultsHtml('') + '</div></div>' +
    '<div class="two-col mt-3" style="grid-template-columns:1fr 1fr">' +

VIEWS.structure = function (params) {

    (directChildren(currentId).length ? generations : emptyState) +
    (guidance && deepestLegs > guidance ? '<div class="tree-advisory">' + esc(deepest.name) + ' has ' + deepestLegs + ' direct legs — structure guidance suggests up to ' + guidance + ' at this level. Guidance only; entry is never blocked.</div>' : '') +
    '</div></div>';

    '<div id="structure-search-results"></div></div>' +
    '<div class="tree-zoom" style="margin-left:auto">' +

    '<button' + (zoom >= ZOOM_MAX - 1e-6 ? ' disabled' : '') + ' title="Zoom in" aria-label="Zoom in" onclick="P.structureZoomBy(1)">+</button>' +
    '<button onclick="P.structureZoomFit()">Fit width</button>' +
    '</div>' +
    '<button class="btn btn-secondary"' + (openPath.length > 1 ? '' : ' disabled') + ' onclick="P.structureCollapseAll()">Collapse all</button>' +
    '<button class="btn btn-secondary" onclick="P.openFullHierarchy()">View full hierarchy</button>' +
    '</div>';

  const content = toolbar + treeWrapHtml +

  return shell(content, { title: 'Structure', sub: 'Open one branch at a time', breadcrumb: breadcrumb });

/* ============================================================
   FULL HIERARCHY WINDOW (FR-10 / Rule-45)
   A separate window that draws the whole structure once and then forgets it. The main console does no work
   beyond counting and opening — no shared state, no refresh, no handle back into here.
   ============================================================ */
const FULL_TREE_GATE = 60;          // V4.5 — above this, name the count and ask first
const FT = { NODE_W: 172, NODE_H: 96, GAP_X: 18, GAP_Y: 46 };
function descendantCount(id) {
  let n = 0;
  (function walk(mid) { directChildren(mid).forEach(function (c) { n++; walk(c.id); }); })(id);
  return n;
}
function openFullHierarchy() {
  const count = descendantCount(ROOT_ID);
  if (count > FULL_TREE_GATE) {
    openModal(
      '<div class="modal-header"><h2>Open the full hierarchy?</h2><button class="modal-close" onclick="P.closeModal()">✕</button></div>' +
      '<div class="modal-body"><p style="font-size:13px;line-height:1.55">This will draw <strong>' + fmtInt(count + 1) + ' members</strong> in a new window. It may take a moment, and a structure this size is very wide — use the zoom to take it in.</p>' +
      '<p class="muted" style="font-size:12.5px;margin-top:10px">The console stays usable while it draws. The new window is a picture of this moment and does not update.</p></div>' +
      '<div class="modal-footer"><button class="btn btn-secondary" onclick="P.closeModal()">Cancel</button><button class="btn btn-primary" onclick="P.closeModal();P.drawFullHierarchy()">Open</button></div>',
      { dismissable: true }
    );
    return;
  }
  drawFullHierarchy();
}
// One post-order pass: work out each subtree's width, place the node over its children, and collect the
// connector segments as we go. No DOM measurement anywhere, so cost is linear in the node count.
function layoutFullTree(rootId) {
  const nodes = [], segs = [];
  let cursor = 0, maxDepth = 0;
  (function place(id, depth) {
    if (depth > maxDepth) maxDepth = depth;
    const kids = directChildren(id);
    let x;
    if (!kids.length) { x = cursor; cursor += FT.NODE_W + FT.GAP_X; }
    else {
      const xs = kids.map(function (c) { return place(c.id, depth + 1); });
      x = (xs[0] + xs[xs.length - 1]) / 2;
    }
    const y = depth * (FT.NODE_H + FT.GAP_Y);
    nodes.push({ m: membersById.get(id), x: x, y: y, depth: depth, legs: kids.length });
    kids.forEach(function (c) {
      const cx = nodes.find(function (n) { return n.m.id === c.id; }).x + FT.NODE_W / 2;
      const px = x + FT.NODE_W / 2, py = y + FT.NODE_H, cy = y + FT.NODE_H + FT.GAP_Y;
      const mid = py + FT.GAP_Y / 2;
      segs.push('M' + px + ' ' + py + 'V' + mid + 'H' + cx + 'V' + cy);
    });
    return x;
  })(rootId, 0);
  return { nodes: nodes, path: segs.join(' '), width: Math.max(cursor, FT.NODE_W), height: (maxDepth + 1) * (FT.NODE_H + FT.GAP_Y) };
}
function drawFullHierarchy() {
  const root = membersById.get(ROOT_ID);
  const L = layoutFullTree(ROOT_ID);
  const ym = viewYm();
  const bv = liveBV(ym);
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark' ||
    (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const stamp = new Date().toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

  const nodesHtml = L.nodes.map(function (n) {
    const m = n.m;
    return '<div class="ft-node' + (n.depth === 0 ? ' ft-root' : '') + (m.active ? '' : ' ft-inactive') + '"' +
      ' id="ft-' + m.id + '" data-name="' + esc(m.name.toLowerCase()) + '" data-id="' + m.id + '" data-phone="' + esc(phoneKey(m.phone)) + '"' +
      ' style="left:' + n.x + 'px;top:' + n.y + 'px">' +
      '<div class="ft-name">' + esc(m.name) + (m.active ? '' : ' <span class="ft-pill">Inactive</span>') + '</div>' +
      '<div class="ft-id">#' + m.id + '</div>' +
      '<div class="ft-bv"><span class="ft-bv-label">Business Volume</span><span class="ft-bv-val">' + fmtInt(bv.get(m.id) || 0) + '</span></div>' +
      '</div>';
  }).join('');

  const doc = '<!doctype html><html lang="en"' + (isDark ? ' data-theme="dark"' : '') + '><head><meta charset="utf-8">' +

function structureToggle(id) {
  if (!directChildren(id).length) return;
  const path = APP.structureOpenPath;
  if (id === path[path.length - 1] && path.length > 1) APP.structureOpenPath = path.slice(0, -1);
  else {
    const ids = ancestorTrail(id).map(function (m) { return m.id; });
    APP.structureOpenPath = ids.slice(ids.indexOf(path[0]));
  }
  render();
}
function structureNodeKey(e, id) {

}
function structureCollapseAll() { APP.structureOpenPath = [APP.structureOpenPath[0]]; render(); }
const ZOOM_MIN = 0.5, ZOOM_MAX = 1.5, ZOOM_STEP = 0.1;
function clampZoom(z) { return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round(z / ZOOM_STEP) * ZOOM_STEP)); }
function structureZoomBy(steps) { APP.structureZoom = clampZoom(APP.structureZoom + steps * ZOOM_STEP); render(); }
function structureZoomFit() {

}

function checkPhone() {
  const phone = val('member-phone').trim();
  const s = MODAL_STATE;
  if (!phone) { setHtml('phone-banner', ''); return; }
  // Rule-34 — uniqueness is a property of the number, not of how it was typed, so compare digits
  const dup = MEMBERS.find(function (m) { return phoneKey(m.phone) === phoneKey(phone) && m.id !== s.id; });
  if (!dup) { setHtml('phone-banner', ''); return; }
  if (dup.active) setHtml('phone-banner', '<div class="modal-danger-note">This number is already in use by <strong>' + esc(dup.name) + '</strong> (#' + dup.id + ').</div>');
  else setHtml('phone-banner', '<div class="modal-warn">This number matches an inactive member — <strong>' + esc(dup.name) + '</strong> (#' + dup.id + '). <a href="javascript:void(0)" onclick="P.switchToReactivate(' + dup.id + ')">Reactivate them instead</a></div>');
}

function saveMember() {
  const s = MODAL_STATE;
  const name = val('member-name').trim(), phone = val('member-phone').trim(), email = val('member-email').trim(), address = val('member-address').trim();
  const errors = [];
  if (!name) errors.push('Name is required.');
  if (!phone) errors.push('Phone is required.');
  if (!address) errors.push('Address is required.');
  if (s.mode === 'add') {
    if (!s.refId) errors.push('Choose an introducer.');
    const consented = document.getElementById('member-consent') && document.getElementById('member-consent').checked;
    if (!consented) errors.push('Consent is required before this member can be saved.');
    const dup = MEMBERS.find(function (x) { return phoneKey(x.phone) === phoneKey(phone); });
    if (dup && dup.active) errors.push('This phone number is already in use by an active member.');
  }
  if (errors.length) { showModalErrors(errors); return; }
  if (s.mode === 'edit') {
    const m = membersById.get(s.id); const changes = [];
    if (m.name !== name) { changes.push(['Name', m.name, name]); m.name = name; }
    if (m.phone !== phone) { changes.push(['Phone', m.phone, phone]); m.phone = phone; }
    if ((m.email || '') !== email) { changes.push(['Email', m.email || '—', email || '—']); m.email = email; }
    if (m.address !== address) { changes.push(['Address', m.address, address]); m.address = address; }
    changes.forEach(function (c) { pushAudit({ member: m.name, field: c[0], before: c[1], after: c[2], cause: 'Member detail corrected' }); });
    closeModal(); toast('Member updated', 'success'); render();
  } else if (s.mode === 'reactivate') {
    const m = membersById.get(s.id);
    m.name = name; m.phone = phone; m.email = email; m.address = address; m.active = true;
    pushAudit({ member: m.name, field: 'Status', before: 'Inactive', after: 'Active', cause: 'Reactivated — phone number matched an existing inactive member' });
    closeModal(); toast('Member reactivated', 'success'); navigate('member', { id: m.id });
  } else {
    const parent = membersById.get(s.refId);
    const nm = addMember(makeMember({ name: name, phone: phone, email: email, address: address, refId: s.refId, level: parent.level + 1, ownBv: 0, joinedDate: isoToday(0) }));
    recalcLive();
    pushAudit({ member: nm.name, field: 'Member', before: '—', after: 'Onboarded', cause: 'Added under ' + parent.name + ' (#' + parent.id + ')' });
    closeModal(); toast('Member added', 'success'); navigate('member', { id: nm.id });
  }
}

  return { min: b.min, max: ym === CURRENT_YM ? isoToday(0) : b.max };
}

    { dismissable: true }

}
function validateClosedEntryModal() {
  const bounds = periodMonthBounds(EDIT_CLOSED_ENTRY_STATE.ym);
  const date = val('closed-entry-date');
  const n = parseFloat(val('closed-entry-amount'));
  const ok = date >= bounds.min && date <= bounds.max && !isNaN(n) && n > 0;
  const btn = document.getElementById('closed-entry-save-btn');
  if (btn) btn.disabled = !ok;
  setHtml('closed-entry-errors', ok ? '' : '<div class="modal-danger-note">Enter an amount greater than zero and a date within the selected month.</div>');

}
function saveClosedEntryModal() {
  if (!validateClosedEntryModal()) return;
  const s = EDIT_CLOSED_ENTRY_STATE;
  const m = membersById.get(s.memberId);
  if (!CLOSED_ENTRIES[s.ym]) CLOSED_ENTRIES[s.ym] = new Map();
  const list = CLOSED_ENTRIES[s.ym].get(s.memberId) || [];
  const newDate = val('closed-entry-date');
  const newAmount = Math.round(parseFloat(val('closed-entry-amount')) * 100) / 100;
  let entry = s.entryId ? list.find(function (e) { return e.id === s.entryId; }) : null;
  const before = entry ? { date: entry.date, amount: entry.amount } : null;
  if (entry) {
    entry.date = newDate; entry.amount = newAmount;
  } else {
    entry = { id: newEntryId(), date: newDate, amount: newAmount };
    list.push(entry);
    CLOSED_ENTRIES[s.ym].set(s.memberId, list);
  }
  const bvMap = new Map();
  CLOSED_ENTRIES[s.ym].forEach(function (entries, mid) {
    bvMap.set(mid, Math.round(entries.reduce(function (sum, e) { return sum + e.amount; }, 0) * 100) / 100);
  });
  const newRows = buildSnapshotRows(bvMap);
  SNAPSHOTS[s.ym].push({ version: SNAPSHOTS[s.ym].length + 1, closedOn: isoToday(0), rows: newRows });
  if (!before) {
    pushAudit({ member: m.name, field: 'Business Volume entry (' + ymLabel(s.ym) + ', added)', before: '—', after: fmt2(newAmount), cause: 'Closed-month record added — new snapshot version created' });
  } else {
    if (before.amount !== newAmount) pushAudit({ member: m.name, field: 'Business Volume entry (' + ymLabel(s.ym) + ', corrected)', before: fmt2(before.amount), after: fmt2(newAmount), cause: 'Closed-month record corrected — new snapshot version created' });
    if (before.date !== newDate) pushAudit({ member: m.name, field: 'Business Volume entry date (' + ymLabel(s.ym) + ', corrected)', before: ddmmyyyy(before.date), after: ddmmyyyy(newDate), cause: 'Closed-month record corrected — new snapshot version created' });
  }
  closeModal(); toast('Correction applied — new backup version created', 'success'); render();
}

/* Whole-console backup & restore (RQ-23) — a second, orthogonal backup mechanism from the

function buildConsoleRestoreCard() {

function openConsoleRestoreConfirm(source, targetId) {
  APP.restoreConfirm = { active: true, source: source, targetId: targetId, checked: false };
  const cb = APP.consoleBackup;
  const target = source === 'settings-list' ? cb.backups.filter(function (b) { return b.id === targetId; })[0] : null;
  const named = target ? target.label : 'the file you choose';
  openModal(
    '<div class="modal-header"><h2>Restore from backup</h2><button class="modal-close" onclick="P.closeModal()">✕</button></div>' +
    '<div class="modal-body">' +
    '<div class="modal-warn"><div class="modal-warn-row">' + ICON.alert +

    '</div></div>' +
    '<label class="checkbox-row"><input type="checkbox" id="restore-confirm-check" onchange="document.getElementById(\'restore-confirm-btn\').disabled = !this.checked">' +

    '</div>' +
    '<div class="modal-footer"><button class="btn btn-secondary" onclick="P.closeModal()">Cancel</button>' +

function confirmConsoleRestore() {
  const rc = APP.restoreConfirm;

  cb.backups.unshift({ id: 'cb-safety-' + Date.now(), label: 'Just now', sub: 'Safety backup — taken automatically before this restore', kind: 'pre_restore_safety' });
  APP.restoreConfirm = { active: false, source: null, targetId: null, checked: false };
  APP.authPhase = 'login'; APP.route = 'home'; APP.params = {};
  render();
  toast(rc.source === 'settings-file' ? 'Restored from the chosen file — sign in again' : 'Console restored — sign in again', 'success');
}

function setSetupMode(mode) { APP.setupDraft.mode = mode; APP.setupDraft.error = ''; render(); }
function setSetupConfirmed(checked) { APP.setupDraft.confirmed = checked; render(); }
function setupContinue() {
  const d = APP.setupDraft;
  if (d.mode === 'pin') {
    const p1 = val('setup-pin'), p2 = val('setup-pin2');
    if (!validPin(p1)) { d.error = 'PIN must be exactly 6 digits.'; render(); return; }
    if (p1 !== p2) { d.error = 'PINs do not match.'; render(); return; }
    d.pin = p1; d.password = '';
  } else {
    const w1 = val('setup-pw'), w2 = val('setup-pw2');
    if (!validPassword(w1)) { d.error = 'Password needs at least 8 characters, with a letter and a number.'; render(); return; }
    if (w1 !== w2) { d.error = 'Passwords do not match.'; render(); return; }
    d.password = w1; d.pin = '';
  }
  d.error = ''; d.recoveryCode = genRecoveryCode(); d.step = 1; render();
}
function setupFinish() {
  const d = APP.setupDraft;
  APP.credentials = { pin: d.pin, password: d.password, recoveryCode: d.recoveryCode };
  APP.authPhase = 'app'; APP.route = 'home'; APP.params = {};
  pushAudit({ member: 'Siddharth Patel', field: 'Console credential', before: '—', after: d.mode === 'pin' ? 'PIN set' : 'Password set', cause: 'First-run setup completed' });
  render(); toast('Console ready — welcome, Siddharth', 'success');

function loginSuccess() {
  APP.failedAttempts = 0; APP.pinBuffer = ''; APP.loginError = '';
  if (APP.authPhase === 'locked') { APP.authPhase = 'app'; render(); toast('Session unlocked', 'success'); }
  else { APP.authPhase = 'app'; render(); toast('Signed in', 'success'); }
}
function loginFail() {
  APP.pinBuffer = '';
  APP.failedAttempts++;
  if (APP.failedAttempts >= 5) { APP.failedAttempts = 0; APP.lockoutUntil = Date.now() + 20000; APP.loginError = ''; }
  else { APP.loginError = 'Incorrect ' + (APP.loginMode === 'pin' ? 'PIN' : 'password') + '. ' + (5 - APP.failedAttempts) + ' attempt' + (5 - APP.failedAttempts === 1 ? '' : 's') + ' remaining.'; }
  render();
}
function pinPress(d) {
  if (APP.pinBuffer.length >= 6) return;
  APP.pinBuffer += String(d); render();
  if (APP.pinBuffer.length === 6) {
    setTimeout(function () {

      if (ok) loginSuccess(); else loginFail();

  }
}

function yearlyAverages() {
  const yms = closedYms(); const n = yms.length || 1;
  return MEMBERS.map(function (m) {
    let sumBv = 0, sumTbv = 0;
    yms.forEach(function (ym) { const snap = latestSnapshot(ym); const row = snap.rows.find(function (r) { return r.id === m.id; }); sumBv += row ? row.bv : 0; sumTbv += row ? row.tbv : 0; });
    return { id: m.id, name: m.name, avgBv: Math.round(sumBv / n * 100) / 100, avgTbv: Math.round(sumTbv / n * 100) / 100, months: n };
  });

    .map(function (m) { return '<tr><td class="cell-primary">' + esc(m.name) + '</td><td class="mono">' + m.id + '</td><td class="num">' + fmt2(liveBV().get(m.id) || 0) + '</td><td class="num">' + fmtInt(liveTBV().get(m.id) || 0) + '</td><td>' + pillSlab(liveRewards().get(m.id).ownSlab) + '</td></tr>'; }).join('');
  const yearly = yearlyAverages().slice().sort(function (a, b) { return b.avgTbv - a.avgTbv; }).slice(0, 6)
    .map(function (d) { return '<tr><td class="cell-primary">' + esc(d.name) + '</td><td class="mono">' + d.id + '</td><td class="num">' + fmt2(d.avgBv) + '</td><td class="num">' + fmt2(d.avgTbv) + '</td></tr>'; }).join('');
  const threshold = APP.lowThreshold != null ? APP.lowThreshold : SETTINGS.lowContributionThreshold;

  const content =
    '<div class="card mb-3"><div class="card-head"><div><div class="card-title">Monthly data</div><div class="card-sub">' + esc(ymLabel(ym)) + ' · current live figures</div></div>' +
    '<button class="btn btn-primary btn-sm" onclick="P.exportMonthly()">' + ICON.file + ' Export .xlsx</button></div>' +
    '<div class="two-col">' +
    '<div><div class="hint mb-3">Always included: Name, Member Number, Phone, Business Volume</div>' +
    '<div style="display:flex;flex-direction:column;gap:7px">' + OPTIONAL_COLUMNS.map(function (c) { return '<label class="checkbox-row"><input type="checkbox" id="col-' + c.key + '"' + (c.def ? ' checked' : '') + '><span>' + esc(c.label) + '</span></label>'; }).join('') + '</div></div>' +
    '<div class="table-wrap"><table><thead><tr><th>Name</th><th>#</th><th class="num">BV</th><th class="num">Total BV</th><th>Slab</th></tr></thead><tbody>' + monthlyPreview + '</tbody></table></div>' +
    '</div></div>' +

    '<div class="card mb-3"><div class="card-head"><div><div class="card-title">Yearly average</div><div class="card-sub">Based on ' + closedYms().length + ' closed month' + (closedYms().length === 1 ? '' : 's') + ' so far, never a fixed twelve</div></div>' +
    '<button class="btn btn-primary btn-sm" onclick="P.exportYearly()">' + ICON.file + ' Export .xlsx</button></div>' +
    '<div class="table-wrap"><table><thead><tr><th>Name</th><th>#</th><th class="num">Average Business Volume</th><th class="num">Average Total Business Volume</th></tr></thead><tbody>' + yearly + '</tbody></table></div></div>' +

    '<div class="card mb-3"><div class="card-head"><div><div class="card-title">Low-contribution report</div><div class="card-sub">Yearly average of own Business Volume, below a threshold</div></div>' +
    '<button class="btn btn-primary btn-sm" onclick="P.exportLow()">' + ICON.file + ' Export .xlsx</button></div>' +
    '<div class="field" style="max-width:200px"><label for="low-threshold">Threshold</label><input id="low-threshold" type="number" min="0" value="' + threshold + '" oninput="P.updateLowThreshold(this.value)"></div>' +
    '<div id="low-section">' + lowSectionHtml(threshold) + '</div></div>' +

    '<div class="card"><div class="card-head"><div><div class="card-title">Closed month snapshot</div><div class="card-sub">Every field as recorded when that month closed</div></div>' +
    '<button class="btn btn-primary btn-sm" onclick="P.exportClosedSnapshot()">' + ICON.file + ' Export .xlsx</button></div>' +
    '<div class="field" style="max-width:260px"><label for="closed-snapshot-ym">Month</label><select id="closed-snapshot-ym">' + closedYms().slice().reverse().map(function (y) { const s = latestSnapshot(y); return '<option value="' + y + '">' + ymLabel(y) + (s.version > 1 ? ' — corrected, v' + s.version : '') + '</option>'; }).join('') + '</select></div>' +
    '<div class="hint">Always exports the latest version. If this month has since been corrected, the export reflects the correction — the original stays in the audit trail, not the file.</div>' +
    '</div>';
  return shell(content, { title: 'Reports', sub: 'Spreadsheet extracts only — no on-screen history of past months' });
};
function updateLowThreshold(v) { const n = parseFloat(v); APP.lowThreshold = isNaN(n) ? SETTINGS.lowContributionThreshold : n; setHtml('low-section', lowSectionHtml(APP.lowThreshold)); }
function exportMonthly() {
  const ym = viewYm();
  const checked = OPTIONAL_COLUMNS.filter(function (c) { const n = document.getElementById('col-' + c.key); return n && n.checked; });
  const header = ['Name', 'Member Number', 'Phone', 'Business Volume'].concat(checked.map(function (c) { return c.label; }));
  const rows = MEMBERS.map(function (m) {
    const base = [m.name, m.id, m.phone, liveBV().get(m.id) || 0];
    const extra = checked.map(function (c) {
      switch (c.key) {
        case 'email': return m.email || '';
        case 'address': return m.address;
        case 'refId': return m.refId || 0;
        case 'introducerName': return m.refId ? membersById.get(m.refId).name : '';
        case 'level': return m.level;
        case 'legs': return directChildren(m.id).length;
        case 'tbv': return liveTBV().get(m.id) || 0;
        case 'slab': return liveRewards().get(m.id).ownSlab;
        case 'rewards': return liveRewards().get(m.id).total;
        case 'royalty': return liveRewards().get(m.id).royalty;
        case 'joined': return ddmmyyyy(m.joinedDate);
        case 'status': return m.active ? 'Active' : 'Inactive';
        default: return '';
      }
    });
    return base.concat(extra);
  });
  downloadXlsx('member-rewards-monthly-' + ym + '.xlsx', 'Monthly data', header, rows);
  toast('Monthly data exported', 'success');
}
function exportYearly() {
  const data = yearlyAverages();
  const header = ['Name', 'Member Number', 'Phone', 'Average Business Volume', 'Average Total Business Volume', 'Months'];
  const rows = data.map(function (d) { const m = membersById.get(d.id); return [m.name, m.id, m.phone, d.avgBv, d.avgTbv, d.months]; });
  const yr = closedYms().length ? closedYms()[0].split('-')[0] : '2026';
  downloadXlsx('member-rewards-yearly-average-' + yr + '.xlsx', 'Yearly average', header, rows);
  toast('Yearly average exported', 'success');
}
function exportLow() {
  const threshold = APP.lowThreshold != null ? APP.lowThreshold : SETTINGS.lowContributionThreshold;
  const data = yearlyAverages().filter(function (d) { return d.avgBv < threshold; });
  const header = ['Name', 'Member Number', 'Phone', 'Average Business Volume', 'Months'];
  const rows = data.map(function (d) { const m = membersById.get(d.id); return [m.name, m.id, m.phone, d.avgBv, d.months]; });
  downloadXlsx('member-rewards-low-contribution-' + CURRENT_YM + '.xlsx', 'Low contribution', header, rows);
  toast('Low-contribution report exported', 'success');
}
function exportClosedSnapshot() {
  const yms = closedYms(); if (!yms.length) return;
  const ym = val('closed-snapshot-ym') || yms[yms.length - 1];
  const snap = latestSnapshot(ym);
  const header = ['Name', 'Member Number', 'Phone', 'Business Volume', 'Total Business Volume', 'Slab %', 'Rewards', 'Royalty earned', 'Status'];
  const rows = snap.rows.map(function (r) { const m = membersById.get(r.id); return [m.name, m.id, m.phone, r.bv, r.tbv, r.slab, r.rewards, r.royalty, r.active ? 'Active' : 'Inactive']; });
  downloadXlsx('member-rewards-closed-' + ym + '-v' + snap.version + '.xlsx', 'Closed snapshot', header, rows);
  toast(ymLabel(ym) + ' snapshot exported (version ' + snap.version + ')', 'success');
}

/* ============================================================
   VIEW — Audit log
   ============================================================ */
function auditRowsHtml(q) {
  const list = AUDIT_LOG.filter(function (e) { return !q || e.member.toLowerCase().indexOf(q) !== -1; });
  if (!list.length) return '<div class="empty-state">' + ICON.audit.replace('<svg ', '<svg style="width:28px;height:28px;margin-bottom:8px;opacity:.5" ') + '<div class="empty-state-title">No matching entries</div></div>';
  const rows = list.map(function (e) {
    return '<tr><td class="mono" style="white-space:nowrap">' + esc(e.ts) + '</td><td>' + esc(e.member) + '</td><td>' + esc(e.field) + '</td><td class="muted">' + esc(e.before) + '</td><td>' + esc(e.after) + '</td><td class="muted">' + esc(e.cause) + '</td></tr>';
  }).join('');
  return '<div class="table-wrap"><table><thead><tr><th>Date &amp; time</th><th>Member</th><th>Field</th><th>Before</th><th>After</th><th>Cause</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}
VIEWS.audit = function () {
  const content = '<div class="field" style="max-width:340px"><div class="search-input-wrap">' + ICON.search + '<input type="text" placeholder="Filter by member name" oninput="P.filterAudit(this.value)"></div></div>' +
    '<div id="audit-rows">' + auditRowsHtml('') + '</div>';
  return shell(content, { title: 'Audit log', sub: fmtInt(AUDIT_LOG.length) + ' recorded changes — no entry is ever edited or removed' });
};
function filterAudit(q) { setHtml('audit-rows', auditRowsHtml(q.trim().toLowerCase())); }
