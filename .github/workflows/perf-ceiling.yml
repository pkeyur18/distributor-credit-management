name: Perf Ceiling

on:
  schedule:
    # Weekly, Monday 03:00 UTC — the 25,000-member/200k-entry ceiling tier
    # alone takes ~6-7 minutes, too slow for every PR (see ci.yml's perf
    # job, which covers the realistic-5,000 tier and the depth/width
    # shape check on every PR/push instead).
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

jobs:
  perf-ceiling:
    name: perf-ceiling
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: DB performance tests (NFR-1/NFR-2, ceiling scale)
        run: cargo test --release --test performance ceiling_scale -- --ignored --nocapture --test-threads=1

  perf-ceiling-e2e:
    name: perf-ceiling-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop

      - name: Install Tauri + WebDriver Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            pkg-config \
            webkit2gtk-driver \
            xvfb

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: UI performance at ceiling scale (25,000 members)
        # wdio.perf.conf.js's onPrepare seeds the real app-data directory
        # (tests/e2e_seed.rs) before launching the app — a fresh runner
        # every run, nothing real to protect (see e2e_seed.rs's own doc
        # comment on why this is CI-only).
        run: xvfb-run npm run test:e2e:perf
