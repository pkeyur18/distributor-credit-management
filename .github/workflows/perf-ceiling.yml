name: Perf Ceiling

on:
  schedule:
    # Weekly, Monday 03:00 UTC — the 25,000-member/200k-entry ceiling tier
    # alone takes ~6-7 minutes, too slow for every PR (see ci.yml's perf
    # job, which covers the realistic-5,000 tier and the depth/width
    # shape check on every PR/push instead).
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

jobs:
  perf-ceiling:
    name: perf-ceiling
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: DB performance tests (NFR-1/NFR-2, ceiling scale)
        run: cargo test --release --test performance ceiling_scale -- --ignored --nocapture --test-threads=1
