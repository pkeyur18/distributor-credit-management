[package]
name = "bvconsole"
version = "0.4.1"
description = "Member Rewards Console"
authors = ["Keyur Patel"]
edition = "2021"
default-run = "bvconsole"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bvconsole_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# TR-1: bundled-sqlcipher-vendored-openssl pinned exactly — SQLCipher's bundled
# build is fragile across toolchain updates, so this version is the known-good
# one recorded at Sprint 1 (rustc 1.97.1, verified 2026-08-09).
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
thiserror = "2.0.20"
rand = "0.9.2"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
# US-M8.1/M8.2 (S5): Argon2id KDF + AES-256-GCM key-wrapping — see
# m8_auth::crypto module doc comment for why a wrapped master key, not a
# credential-derived SQLCipher key directly, is required.
argon2 = "0.5.3"
aes-gcm = "0.10.3"
# US-M2.2 (S7): checksums the internal-retained backup copy written on a
# closed-month correction (`backup::write_backup_copy`) — S11/S14 reuse the
# same helper for the close backup and console backup respectively.
sha2 = "0.10.9"
# T-M7.4-5: the native file picker behind Settings' "Restore from a file…".
tauri-plugin-dialog = "2.7.2"
# US-M6.1 (S13)/ADR-007: all .xlsx generation happens Rust-side — the
# WebView only ever hands back a destination path chosen through the same
# native save dialog restore already uses for source paths, never raw file
# content.
rust_xlsxwriter = "0.90.1"
# ADR-013: extends ADR-007's Rust-side-generation boundary to a second file
# type. genpdf paginates flowing content (tables) automatically — the
# direct-legs table has no fixed row count, and printpdf alone would need
# hand-rolled page-break logic for it.
genpdf = "0.2.0"

[dev-dependencies]
proptest = "1.8.0"
# T-M4.8's pagination spike only: counts rendered pages via raw PDF object
# structure. Not `pdf-extract` — its `adobe-cmap-parser` dependency panics
# ("index out of bounds") on any text genpdf/printpdf-0.3.4 produces, even
# plain ASCII, confirmed 15 Aug 2026. lopdf reads page-tree structure only,
# no CMap/glyph decoding, so it avoids that crash entirely.
lopdf = "0.42"
tauri = { version = "2.11.5", features = ["test"] }

[profile.release]
# panic stays "unwind" (the default) — §3.2's preview_settings_impact restores
# live settings from inside a panic-safe guard, which needs unwinding to run.
codegen-units = 1
lto = true
opt-level = "s"
strip = true

