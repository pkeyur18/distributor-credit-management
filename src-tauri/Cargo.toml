[package]
name = "bvconsole"
version = "0.1.0"
description = "Business Volume Console"
authors = ["Keyur Patel"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bvconsole_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# TR-1: bundled-sqlcipher-vendored-openssl pinned exactly — SQLCipher's bundled
# build is fragile across toolchain updates, so this version is the known-good
# one recorded at Sprint 1 (rustc 1.97.1, verified 2026-08-09).
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
thiserror = "2.0.20"
rand = "0.9.2"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
# US-M8.1/M8.2 (S5): Argon2id KDF + AES-256-GCM key-wrapping — see
# m8_auth::crypto module doc comment for why a wrapped master key, not a
# credential-derived SQLCipher key directly, is required.
argon2 = "0.5.3"
aes-gcm = "0.10.3"
# US-M2.2 (S7): checksums the internal-retained backup copy written on a
# closed-month correction (`backup::write_backup_copy`) — S11/S14 reuse the
# same helper for the close backup and console backup respectively.
sha2 = "0.10.9"
# T-M7.4-5: the native file picker behind Settings' "Restore from a file…".
tauri-plugin-dialog = "2.7.2"

[dev-dependencies]
proptest = "1.8.0"
tauri = { version = "2.11.5", features = ["test"] }

[profile.release]
# panic stays "unwind" (the default) — §3.2's preview_settings_impact restores
# live settings from inside a panic-safe guard, which needs unwinding to run.
codegen-units = 1
lto = true
opt-level = "s"
strip = true

